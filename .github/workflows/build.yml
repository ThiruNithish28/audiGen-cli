name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Build EXE
        run: >
          poetry run pyinstaller
          --onefile
          --name auditgen
          --add-data "template;template"
          --hidden-import audigen_cli.extractor
          --hidden-import audigen_cli.llm_client
          --hidden-import audigen_cli.excelWriter
          --hidden-import audigen_cli.config
          --hidden-import audigen_cli.banner
          --hidden-import audigen_cli.utils
          --collect-all google.genai
          --collect-all docx
          --collect-all openpyxl
          --collect-all questionary
          --collect-all rich
          --collect-all pydantic
          audigen_cli/cli.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: auditgen-windows
          path: dist/auditgen.exe
          retention-days: 30